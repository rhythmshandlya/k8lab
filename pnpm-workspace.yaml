allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@vercel/backends@0.8.36"
  - "@vercel/build-utils@14.0.5"
  - "@vercel/cervel@0.1.44"
  - "@vercel/cli-auth@0.3.4"
  - "@vercel/detect-agent@1.2.5"
  - "@vercel/elysia@0.1.113"
  - "@vercel/express@0.1.127"
  - "@vercel/fastify@0.1.116"
  - "@vercel/gatsby-plugin-vercel-builder@2.2.39"
  - "@vercel/go@3.11.0"
  - "@vercel/h3@0.1.122"
  - "@vercel/hono@0.2.116"
  - "@vercel/koa@0.1.96"
  - "@vercel/nestjs@0.2.117"
  - "@vercel/node@5.9.9"
  - "@vercel/python-analysis@0.13.2"
  - "@vercel/python@6.56.1"
  - "@vercel/remix-builder@5.9.4"
  - "@vercel/static-build@2.12.5"
  - "@vercel/vc-native-darwin-arm64@58.9.4"
  - "@vercel/vc-native-darwin-x64@58.9.4"
  - "@vercel/vc-native-linux-arm64@58.9.4"
  - "@vercel/vc-native-linux-x64@58.9.4"
  - vercel@58.9.4

# Security floors for transitive runtime packages. Remove an override once every
# parent dependency declares a patched compatible range of its own.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  dompurify: ^3.4.13
  "js-yaml@>=4.0.0 <5.0.0": 4.3.1
  "minimatch@>=10.0.0 <10.2.3": 10.2.3
  "path-to-regexp@>=4.0.0 <6.3.0": 6.3.0
  "path-to-regexp@>=8.0.0 <8.4.0": 8.4.0
  postcss: ^8.5.26
  sharp: ^0.35.4
  "tar@<=7.5.18": 7.5.19
  "undici@>=7.0.0 <7.29.0": ^7.29.0
